<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:"Plex Arabic";font-weight:700;src:url("fonts/IBMPlexSansArabic-Bold.ttf")}
html,body{margin:0;width:1200px;height:630px;background:#0A0A4F;overflow:hidden}
body{position:relative;font-family:"Segoe UI",Arial,sans-serif;color:#fff}
.shape{position:absolute;inset:0;background:#00008B;opacity:.55;clip-path:polygon(62% 0,100% 0,100% 100%,38% 100%)}
.wm{position:absolute;right:-20px;bottom:-60px;font:900 300px/1 "Segoe UI",Arial,sans-serif;letter-spacing:8px;color:#fff;opacity:.04}
.c{position:absolute;left:80px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
img{width:460px;height:auto;display:block}
.line{width:96px;height:4px;background:#E30613;margin:44px 0 36px;position:relative}
.line:after{content:"";position:absolute;left:104px;top:0;width:24px;height:4px;background:repeating-linear-gradient(90deg,#E30613 0 6px,transparent 6px 12px)}
.en{font-size:46px;font-weight:800;letter-spacing:.5px}
.ar{font-family:"Plex Arabic",serif;font-size:46px;font-weight:700;margin-top:10px;direction:rtl;text-align:left}
.tag{font-size:26px;color:rgba(255,255,255,.82);margin-top:26px}
</style></head><body>
<div class="shape"></div><div class="wm">ZIMAM</div>
<div class="c">
<img src="../../public/images/logo/zimam-logo-white.svg">
<div class="line"></div>
<div class="en">ZIMAM Electrical Company</div>
<div class="ar">شركة زمام للكهرباء</div>
<div class="tag">Engineering Excellence in Modern Infrastructure</div>
</div></body></html>
